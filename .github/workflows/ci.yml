name: gate

# Jarvis's close-out regression gate, run on every push and PR.
#
# Runs on windows-latest deliberately: Jarvis is a Windows-native application
# (WASAPI audio, SAPI TTS, the tray/overlay layer), so a Linux runner would be
# testing a platform the code never ships on.
#
# CI installs requirements-ci.txt — the plain-wheel subset of requirements.txt.
# The gate is the SAME command developers run locally; `--allow-missing-deps`
# reclassifies "this suite needs torch/ctranslate2/SAPI" as SKIP (printed by
# name) instead of FAIL. Anything else is still a failure.
#
# Coverage: 40 of 45 gates, ~55 s. The 5 skipped gates need faster-whisper or
# the Windows SAPI bindings and are covered by the full local run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run the regression gate
        run: python scripts/run_all_tests.py --allow-missing-deps
